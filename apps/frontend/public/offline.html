<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>IEPF Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: #0a0a0a;
        color: #e2e8f0;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: 40vw;
        background: #171717;
        border-radius: 16px;
        padding: 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .brand img {
        width: 44px;
        height: 44px;
      }
      .brand h2 {
        margin: 0;
        font-size: 16px;
        color: #94a3b8;
        font-weight: 600;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 16px;
        color: #cbd5f5;
        line-height: 1.5;
      }
      .actions {
        margin-top: 24px;
        display: flex;
        justify-content: center;
      }
      button {
        appearance: none;
        border: 0;
        background: #e2e8f0;
        color: #0a0a0a;
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
      }
      a {
        color: #93c5fd;
      }
      a:hover {
        color: #bfdbfe;
      }

      @media screen and (max-width: 600px) {
        .card {
          width: 80vw;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="brand">
          <h2>InsiemeÈ+Facile</h2>
        </div>
        <h1>Sito non raggiungibile</h1>
        <p>
          Controlla la tua connessione e riprova.<br />Se la tua connessione
          funziona correttamente, potrebbe esserci un problema temporaneo sul
          sito.
        </p>
        <p>
          Puoi segnalarlo scrivendo a
          <a href="mailto:iepf@hensemberger.it">iepf@hensemberger.it</a>.
        </p>
        <div class="actions">
          <button onclick="window.location.reload()">Riprova</button>
        </div>
      </div>
    </div>
  </body>
</html>
