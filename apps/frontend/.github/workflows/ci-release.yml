name: CI and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run build
  release:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build application image
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/iti-p-hensemberger/iepf-frontend:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Request production deployment
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/iti-p-hensemberger/iepf-frontend@${{ steps.app.outputs.digest }}
          TOOLS_IMAGE: ''
          SOURCE_SHA: ${{ github.sha }}
        run: |
          # Do not deploy an older commit whose build finished after a newer push.
          head=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$head" != "$SOURCE_SHA" ]]; then
            echo 'A newer commit is on main; skipping deployment request.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$GH_TOKEN" || { echo 'Missing INFRA_DISPATCH_TOKEN'; exit 1; }
          jq -n --arg component frontend --arg image "$IMAGE"             --arg tools "$TOOLS_IMAGE" --arg sha "$SOURCE_SHA"             '{event_type:"release",client_payload:{component:$component,image:$image,tools_image:$tools,sha:$sha}}'             | gh api repos/ITI-P-Hensemberger/iepf-infra/dispatches --input -
          echo "Published $IMAGE and requested deployment" >> "$GITHUB_STEP_SUMMARY"
