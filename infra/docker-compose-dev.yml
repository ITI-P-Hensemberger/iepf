services:
  db-dev:
    image: postgres:16
    container_name: postgres-dev
    restart: always
    shm_size: 128mb
    env_file:
      - .env.postgres
    ports:
      - '5432:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
  db-test:
    image: postgres:16
    container_name: postgres-test
    restart: always
    shm_size: 128mb
    env_file:
      - .env.postgres
    ports:
      - '5433:5432'
    volumes:
      - ./postgres-test-data:/var/lib/postgresql/data
